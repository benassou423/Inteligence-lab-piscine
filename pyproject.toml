[project]
name = "feed-the-beast"
version = "0.1.0"
description = "Piscine I Lab « Feed the Beast » : pipeline de données en français et banc d'essai GPT ~10M"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "regex",
    "zstandard",
    "requests",
    "warcio",
    "lxml",
    "datasets",
    "huggingface_hub",
    "ftfy",
    "trafilatura",
    "datasketch",
    "xxhash",
    "tokenizers",
    "torch",
    "matplotlib",
    "fasttext-numpy2>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
